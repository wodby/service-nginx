name: nginx
type: service
icon: nginx
title: Nginx
scalable: true

options:
- version: '1.31'
  tag: '1.31-5.48.7'
  default: true
- version: '1.30'
  tag: '1.30-5.48.7'
- version: '1.29'
  tag: '1.29-5.46.12'
  eol: '2026-05-13T00:00:00+00:00'
- version: '1.28'
  tag: '1.28-5.46.12'
  eol: '2026-04-14T00:00:00+00:00'
- version: '1.27'
  tag: '1.27-5.43.0'
  eol: '2025-06-24T00:00:00+00:00'
- version: '1.25'
  tag: '1.25-5.36.0'
  eol: '2024-05-29T00:00:00+00:00'

links:
- name: backend
  title: Backend
  required: false
  env:
  - name: NGINX_BACKEND_HOST
    value: '{{link.host}}'
  - name: NGINX_BACKEND_PORT
    value: '{{link.port}}'
  selectors:
  - type: service

endpoints:
- name: http
  ports:
  - name: http
    number: 80
    protocol: http
    main: true

labels:
- nginx

build:
  connect: true
  boilerplates:
  - name: react
    title: React boilerplate
    repo: https://github.com/wodby/react-boilerplate
    branch: main

settings:
- name: docroot
  title: Nginx docroot subdir
  var: DOCROOT_SUBDIR

configs:
- name: main
  title: Main
  filepath: /etc/gotpl/config/nginx.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/config/nginx.conf.tmpl
- name: vhost
  title: Virtual host
  filepath: /etc/gotpl/vhost.conf.tmpl
  default:
    source: image
    filepath: /etc/gotpl/vhost.conf.tmpl

env:
- name: NGINX_VHOST_PRESET
  value: html
- name: NGINX_SERVER_ROOT
  value: /var/www/html/$(DOCROOT_SUBDIR)

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/nginx
  chart: oci://registry-1.docker.io/wodby/nginx
  version: 0.2.2

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: commonLabels
    annotations: commonAnnotations
    volumes: extraVolumes
  containers:
  - name: nginx
    image: wodby/nginx
    build: true
    helm:
      resources: resources
      env: extraEnvVars
      mounts: extraVolumeMounts
